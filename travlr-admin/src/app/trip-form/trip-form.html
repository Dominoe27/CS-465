<div class="container mt-4">
  <h3 class="mb-3">{{ isEdit ? 'Edit Trip' : 'Add Trip' }}</h3>

  <!-- I keep the UX simple on purpose: a loading message and a basic error. -->
  <div *ngIf="loading" class="alert alert-info">Loading…</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Form groups mirror the schema so validation is predictable. -->
  <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Code</label>
        <input class="form-control" formControlName="code">
      </div>
      <div class="col-md-8">
        <label class="form-label">Name</label>
        <input class="form-control" formControlName="name">
      </div>
      <div class="col-md-4">
        <label class="form-label">Length (days)</label>
        <input type="number" class="form-control" formControlName="length" min="1">
      </div>
      <div class="col-md-4">
        <label class="form-label">Start</label>
        <input type="date" class="form-control" formControlName="start">
      </div>
      <div class="col-md-4">
        <label class="form-label">Resort</label>
        <input class="form-control" formControlName="resort">
      </div>
      <div class="col-md-4">
        <label class="form-label">Price</label>
        <input type="number" class="form-control" formControlName="price" min="0" step="0.01">
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="pp" formControlName="perPerson">
          <label for="pp" class="form-check-label">Per Person</label>
        </div>
      </div>
      <div class="col-md-8">
        <label class="form-label">Image URL</label>
        <input class="form-control" formControlName="image">
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea rows="4" class="form-control" formControlName="description"></textarea>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit" [disabled]="saving">
        {{ isEdit ? 'Update' : 'Add Trip' }}
      </button>
      <a class="btn btn-secondary" routerLink="/trips">Cancel</a>
      <button *ngIf="isEdit" class="btn btn-outline-danger ms-auto" type="button" (click)="delete()">
        Delete
      </button>
    </div>
  </form>
</div>
