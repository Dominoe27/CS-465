<div class="card h-100">
  <!-- Image is optional in data; the UI tolerates missing URLs -->
  <img [src]="trip.image" class="card-img-top" [alt]="trip.name">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>
    <p class="card-text">{{ trip.description }}</p>

    <p class="mb-0"><strong>Resort:</strong> {{ trip.resort }}</p>
    <p class="mb-0"><strong>Length:</strong> {{ trip.length }} day(s)</p>

    <p class="mb-0">
      <strong>Price:</strong> {{ trip.price | currency }}
      <span *ngIf="trip.perPerson"> per person</span>
    </p>
  </div>

  <!-- Edit route follows /edit/:id to keep grading instructions straightforward -->
  <div class="card-footer bg-white border-0">
    <a class="btn btn-primary w-100" [routerLink]="['/edit', trip._id]">Edit</a>
  </div>
</div>
